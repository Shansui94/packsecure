name: packsecure_flutter
description: Packsecure OS 100% Google Stack Native Flutter App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Official Ecosystem Packages
  google_maps_flutter: ^2.5.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  geolocator: ^10.1.0

  # Native & Offline Storage Packages
  sqflite: ^2.3.0
  path: ^1.8.3
  blue_thermal_printer: ^1.2.3
  supabase_flutter: ^2.3.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
