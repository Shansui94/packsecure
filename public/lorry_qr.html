<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APD 9821 货车出车/还车 QR Code (测试录屏专用)</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 28px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: #d97706;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 9999px;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 6px 0;
            color: #f8fafc;
        }
        p.sub {
            color: #94a3b8;
            font-size: 13px;
            margin: 0 0 24px 0;
        }
        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        canvas {
            display: block;
        }
        .info-box {
            margin-top: 24px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px;
            text-align: left;
            font-size: 12px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .info-box code {
            color: #38bdf8;
            word-break: break-all;
        }
        .tips {
            margin-top: 16px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🚚 录屏测试辅助 / KOD QR LORI</div>
        <h1>APD 9821</h1>
        <p class="sub">Packsecure Taiping • 1-Ton Lorry</p>

        <div class="qr-container">
            <canvas id="qrcode"></canvas>
        </div>

        <div class="info-box">
            <strong>QR Payload 数据：</strong><br>
            <code id="payload-text"></code>
        </div>

        <p class="tips">
            💡 <strong>录屏说明：</strong><br>
            手机录屏时，打开司机端扫码对准此二维码即可绑定货车出车。<br>
            （如不方便扫码，也可在司机端扫码框下方直接点击 <strong>[⚡ Pilih Lori Ujian (APD 9821)]</strong> 一键绑定）
        </p>
    </div>

    <script>
        const qrData = JSON.stringify({
            type: "LorryBind",
            lorryId: "23572333-dba1-421a-b6fd-83d937cfe954",
            plate: "APD 9821"
        });

        document.getElementById('payload-text').innerText = qrData;

        QRCode.toCanvas(document.getElementById('qrcode'), qrData, {
            width: 260,
            margin: 0,
            color: {
                dark: '#000000',
                light: '#ffffff'
            }
        }, function (error) {
            if (error) console.error(error);
        });
    </script>
</body>
</html>
